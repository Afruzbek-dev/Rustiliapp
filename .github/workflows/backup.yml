name: Database backup

on:
  schedule:
    - cron: "43 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install PostgreSQL 16 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Dump and compress
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Repository secret SUPABASE_DB_URL is not set."
            exit 1
          fi
          umask 077
          # The URI must be passed as --dbname: libpq does not expand a URI placed in PGDATABASE.
          # GitHub masks the secret in logs; never echo it or enable `set -x`.
          file="backup-$(date -u +%Y%m%d).sql.gz"
          /usr/lib/postgresql/16/bin/pg_dump --dbname="$SUPABASE_DB_URL" --no-owner --no-privileges | gzip -9 > "$file"

          # Sanity checks: a failed or empty dump must fail the job.
          size=$(stat -c %s "$file")
          if [ "$size" -lt 1024 ]; then
            echo "::error::Backup is suspiciously small ($size bytes)."
            exit 1
          fi
          header=$(zcat "$file" | head -n 20 || true)
          if ! grep -q 'PostgreSQL database dump' <<<"$header"; then
            echo "::error::Backup does not look like a pg_dump file."
            exit 1
          fi
          ls -l "$file"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backup-*.sql.gz
          retention-days: 90
          if-no-files-found: error
